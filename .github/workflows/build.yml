name: build

# Builds the single-binary personal-site (4 platforms) and a single multi-arch
# OCI image (linux/amd64 + linux/arm64) whenever code lands on main.
#
# The web assets (Next.js static export) are embedded into the Go binary at
# compile time via //go:embed, so they are built once and shared with every
# downstream job rather than rebuilding Next.js repeatedly.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

# Cancel a superseded run when new commits are pushed to the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"

jobs:
  # Build the Next.js static export (web/site/out) once. This directory is
  # gitignored and therefore absent from a fresh checkout, but the Go binary's
  # //go:embed directive requires it to exist at compile time.
  build-web:
    name: Build web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/site/package-lock.json

      - name: Build Next.js static export
        working-directory: web/site
        run: |
          npm ci
          npm run build
          # Fail early if the export didn't land where //go:embed expects it.
          test -f out/index.html

      - name: Upload web export
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/site/out
          retention-days: 1

  # Run the whole test suite (unit + e2e) with coverage, then publish the
  # total coverage as a shields.io endpoint badge: a small JSON committed to
  # .github/badges/coverage.json on main, which the README badge points at.
  test:
    name: Tests & coverage badge
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the updated coverage badge
    env:
      # A full Go >= 1.25 install, not an auto-switched toolchain: with a
      # switched toolchain "go test -cover" fails with 'no such tool
      # "covdata"' (golang/go#75031).
      GO_VERSION: "1.25"
    steps:
      - uses: actions/checkout@v4

      - name: Download web export
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/site/out

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests with coverage
        run: go test ./... -coverpkg=./... -coverprofile=coverage.out -timeout 10m

      - name: Generate coverage badge JSON
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')
          color=$(awk -v t="$total" 'BEGIN {
            if (t >= 80) print "brightgreen";
            else if (t >= 60) print "green";
            else if (t >= 40) print "yellow";
            else if (t >= 20) print "orange";
            else print "red";
          }')
          mkdir -p .github/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$total" "$color" > .github/badges/coverage.json
          cat .github/badges/coverage.json

      # Pushes made with GITHUB_TOKEN do not trigger new workflow runs, so
      # this cannot loop. If a human push to main wins the race, this push
      # fails and the badge is simply updated by that push's own run instead.
      - name: Commit coverage badge if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          if git diff --cached --quiet; then
            echo "coverage unchanged; badge already up to date"
          else
            git commit -m "docs: update coverage badge [skip ci]"
            git push origin HEAD:main
          fi

  # Cross-compile the single-binary executable for every target platform.
  # Binaries are uploaded as downloadable artifacts per platform.
  build-binary:
    name: Binary ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Download web export
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/site/out

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o bin/personal-site ./cmd/server
          file bin/personal-site

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: personal-site-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/personal-site

  # Build a single multi-arch OCI image (linux/amd64 + linux/arm64) and push it
  # to GHCR under one tag. The Dockerfile uses $BUILDPLATFORM + Go cross-
  # compilation, so no QEMU is needed and both arches build natively.
  build-image:
    name: Multi-arch OCI image
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download web export
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/site/out

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
