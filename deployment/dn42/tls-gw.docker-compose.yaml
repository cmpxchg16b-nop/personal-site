name: tls-gw
volumes:
  caddydata:
services:
  web:
    container_name: dn42-personal-site
    image: docker.io/library/caddy:latest
    environment:
      - "ACME_CONTACT_EMAIL=i@exploro.one"
    network_mode: "ns:/run/netns/svcs"
    dns:
      - "fdda:8ca4:1556:3000::8376:bf72"
    volumes:
      - "./caddy.json:/caddy.json:ro"
      - "./dn42-root-ca.crt:/dn42-root-ca.crt:ro"
      - "caddydata:/caddydata"
    command:
      - "caddy"
      - "run"
      - "--config=/caddy.json"
