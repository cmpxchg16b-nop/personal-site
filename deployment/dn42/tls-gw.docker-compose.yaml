#   host: fdda:8ca4:1556:3000::8376:bf72/127
# vie1-fra1 interconnect:
#   vie1: fdda:8ca4:1556:3000::8376:bf71/127
#   fra1: fdda:8ca4:1556:3000::8376:bf70/127
