# coturn TURN/STUN server for dn42 (nexus.dn42)
# Runs inside the shared "svcs" netns - reachable on dn42 addresses only,
# no host port mapping required.

# STUN/TURN listener (UDP + TCP)
listening-port=3478

realm=nexus.dn42

# Public server: no authentication. STUN requests and TURN relay
# allocations are open to anyone who can reach it - it only listens on
# dn42 addresses (shared "svcs" netns), so exposure is limited to dn42.

fingerprint

# Keep logs on stdout for `docker logs` / `podman logs`
log-file=stdout

# Relay port range (defaults shown; restrict if desired)
# min-port=49152
# max-port=65535

# TURN over TLS (port 5349) can be enabled later with cert=/pkey= once
# certificates are provisioned.
